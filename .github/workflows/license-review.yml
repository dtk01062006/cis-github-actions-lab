
name: CIS 3.2.3 - License Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-review:
    name: Scan Python package licenses
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install packages
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install \
            -r requirements.txt pip-licenses==5.5.5

      - name: Display dependency licenses
        run: |
          .venv/bin/pip-licenses --format=markdown
          
      - name: Enforce license policy
        run: |
          .venv/bin/pip-licenses --allow-only="Apache-2.0;Apache Software License;MIT;MIT License;BSD-3-Clause;BSD License;ISC;MPL-2.0"

