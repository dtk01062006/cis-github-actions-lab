
name: CIS 4.1.2 and 4.1.3 - Protected Artifact

on:
  push:
    branches: [main, dtk0106-patch-3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  encrypt-artifact:
    name: Encrypt artifact with public key
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cryptography
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install cryptography==50.0.2

      - name: Encrypt with AES-256-GCM and RSA-OAEP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          .venv/bin/python - <<'PY'
          import os
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          public_key = serialization.load_pem_public_key(
              Path("keys/public.pem").read_bytes()
          )

          plaintext = b"CIS confidential data: " + os.urandom(48)
          aes_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)

          ciphertext = AESGCM(aes_key).encrypt(
              nonce, plaintext, None
          )

          wrapped_key = public_key.encrypt(
              aes_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None
              )
          )

          Path("output/message.enc").write_bytes(nonce + ciphertext)
          Path("output/key.wrapped").write_bytes(wrapped_key)
          Path("output/plaintext.sha256").write_text(
              hashlib.sha256(plaintext).hexdigest() + "\n"
          )

          print("PASS: AES-256-GCM encryption successful")
          print("PASS: AES key protected using RSA-OAEP")
          print("PASS: Private key not required for encryption")
          PY

      - name: Upload encrypted files only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-artifact-${{ github.run_id }}
          path: |
            output/message.enc
            output/key.wrapped
            output/plaintext.sha256
          if-no-files-found: error
          retention-days: 7

  authorized-decryption:
    name: CIS 4.1.3 - Authorized decryption
    needs: encrypt-artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: trusted-decryption

    permissions:
      contents: read

    steps:
      - name: Download encrypted artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: protected-artifact-${{ github.run_id }}
          path: encrypted

      - name: Install cryptography
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install cryptography==50.0.2

      - name: Decrypt using protected private key
        shell: bash
        env:
          PRIVATE_KEY_PEM: ${{ secrets.ARTIFACT_DECRYPTION_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail

          if [ -z "$PRIVATE_KEY_PEM" ]; then
            echo "::error::Decryption key unavailable"
            exit 1
          fi

          .venv/bin/python - <<'PY'
          import os
          import hashlib
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          private_key = serialization.load_pem_private_key(
              os.environ["PRIVATE_KEY_PEM"].encode(),
              password=None
          )

          wrapped_key = Path("encrypted/key.wrapped").read_bytes()

          aes_key = private_key.decrypt(
              wrapped_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None
              )
          )

          encrypted_data = Path("encrypted/message.enc").read_bytes()

          plaintext = AESGCM(aes_key).decrypt(
              encrypted_data[:12],
              encrypted_data[12:],
              None
          )

          expected_hash = Path(
              "encrypted/plaintext.sha256"
          ).read_text().strip()

          actual_hash = hashlib.sha256(plaintext).hexdigest()

          assert actual_hash == expected_hash, "Integrity check failed"

          print("PASS: Environment approval completed")
          print("PASS: Private key accessed successfully")
          print("PASS: AES key recovered using RSA-OAEP")
          print("PASS: Artifact decrypted successfully")
          print("PASS: Decrypted artifact integrity verified")
          PY
